# On every pull request: build, run the tests, check the Docker image builds.
# On every merge to main: the same, then publish the image to GitHub Container Registry
# as ghcr.io/l1bre-dev/tradingapp:latest and :sha-<commit> (the VPS pulls it from there).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build L1bre.Journal.slnx -c Release
      - run: dotnet test L1bre.Journal.slnx -c Release --no-build

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/l1bre-dev/tradingapp:latest
            ghcr.io/l1bre-dev/tradingapp:sha-${{ github.sha }}
